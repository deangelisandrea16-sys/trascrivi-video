name: Trascrivi video da link

on:
  push:
    branches: [main]
    paths: ['richieste/**']
  workflow_dispatch:

concurrency:
  group: trascrivi
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trascrivi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Cache modello Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Installa ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Installa dipendenze
        run: pip install -q -U -r tools/requirements.txt
      - name: Trascrivi
        env:
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
        run: python tools/trascrivi.py
      - name: Salva trascrizioni
        run: |
          git config user.name "trascrivi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trascrizioni
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Trascrizioni aggiornate"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
